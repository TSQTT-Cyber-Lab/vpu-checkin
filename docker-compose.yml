services:
  # Main application service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpu-checkin-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Postgres connection — the app now actually reads this (server/db.js)
      DATABASE_URL: ${DATABASE_URL:-postgresql://vpu_admin:change_me_in_production@db:5432/vpu_checkin}
      # Required for real Google Sign-In (ID-token verification only — no client secret needed)
      GOOGLE_CLIENT_ID: 317070939868-mfljetk2g6k8d9f5bts2912b54tji7gl.apps.googleusercontent.com
      AUTH_SECRET: OsHh1cyOUHZo+eUW2c6wYAyjlmWJ3XXJDW4OIFMPgzvvSeT5GWT2wmznWYI=
      # Session cookie signing key — required, server refuses to start on the placeholder value
      # Always granted admin, independent of the roles document (see server/roles.js)
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-son.pt@tbd.edu.vn}
    networks:
      - vpu-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.vpu.service=app"

  # PostgreSQL database service (optional, comment out if using SQLite/In-memory)
  db:
    image: postgres:15-alpine
    container_name: vpu-checkin-db
    environment:
      POSTGRES_DB: ${DB_NAME:-vpu_checkin}
      POSTGRES_USER: ${DB_USER:-vpu_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      # Volume for database persistence
      - db_data:/var/lib/postgresql/data
      # Optional: Initialization SQL script
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - vpu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vpu_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.vpu.service=database"

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vpu-checkin-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change_me}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - vpu-network
    depends_on:
      - db
    restart: unless-stopped
    profiles:
      - debug
    labels:
      - "com.vpu.service=pgadmin"

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: vpu-checkin-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    networks:
      - vpu-network
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - production
    labels:
      - "com.vpu.service=nginx"

volumes:
  db_data:
    driver: local
    labels:
      - "com.vpu.volume=database"

networks:
  vpu-network:
    driver: bridge
    labels:
      - "com.vpu.network=internal"

# Usage:
# Production mode (with app only):
#   docker-compose up -d
#
# Development mode (with pgAdmin):
#   docker-compose --profile debug up -d
#
# Production with Nginx:
#   docker-compose --profile production up -d
#
# Stop services:
#   docker-compose down
#
# View logs:
#   docker-compose logs -f app
#   docker-compose logs -f db
#
# Rebuild images:
#   docker-compose build --no-cache
